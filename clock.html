<!DOCTYPE html>
<html>
<head>
  <title>Clock</title>
</head>

<body>

  <h1 id="time">0:00:00</h1>
  <h2 id="date">0/00/0000</h2>

  <script>
    let now = new Date();
    let time = now.toLocaleTimeString();

    document.getElementById("time").innerText = time;

    //just realized instead of two funcs i could make one but too late, keep it like that.
    function updateTime() {
        let now = new Date();
        let time = now.toLocaleTimeString();

        document.getElementById("time").innerText = time;
    }   

    updateTime();
    setInterval(updateTime, 1000);

    function updateDate() {
        let now = new Date
        let date = now.toLocaleDateString()

        document.getElementById("date").innerText = date;

    }

    updateDate()
    // the line below is mostly used by Intense user, I hope no one uses this for 1 whole day or at midnight but lets keep it, why not.
    setInterval(updateDate, 100000) // every 100 seconds

  </script>

</body>
</html>
