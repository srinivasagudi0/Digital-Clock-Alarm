<!DOCTYPE html>
<html>
<head>
  <title>Clock</title>
</head>

<body>

  <h1 id="time">0:00:00</h1>
  <h2 id="date">0/00/0000</h2>

  <input type="time", id="alarmTime">
  <button onclick="setAlarm()">Set Alarm</button>


<script>
    // refactored and made it into one function that displays both time and date
  let alarm = "";

  function updateTime() {
     let now = new Date();

    let time = now.toLocaleTimeString();
    
    let date = now.toLocaleDateString();

    document.getElementById("time").innerText = time;
    document.getElementById("date").innerText = date;

     let currentTime = now.toTimeString().slice(0, 5);

    if (alarm === currentTime) {
      alert("Alarm is Ringing!");
      alarm = ""; //change it back to neutral agin
    }
  }

  function setAlarm() {
    alarm = document.getElementById("alarmTime").value;
    alert("Alarm set for " + alarm);
  }

  updateTime();
  setInterval(updateTime, 1000);
</script>

</body>
</html>
