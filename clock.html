<!DOCTYPE html>
<html>
<head>
  <title>Clock</title>
</head>

<body>

  <h1 id="time">0:00:00</h1>

  <script>
    let now = new Date();
    let time = now.toLocaleTimeString();

    document.getElementById("time").innerText = time;

    function updateTime() {
        let now = new Date();
        let time = now.toLocaleTimeString();

        document.getElementById("time").innerText = time;
    }   

    updateTime();
    setInterval(updateTime, 1000);

  </script>

</body>
</html>
