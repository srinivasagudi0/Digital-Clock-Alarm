<!DOCTYPE html>
<html>
<head>
  <title>Clock</title>
</head>

<body>

  <h1 id="time">0:00:00</h1>
  <h2 id="date">0/00/0000</h2>

  <input type="time" id="alarmTime">
  <button onclick="setAlarm()">Set Alarm</button>
  <audio id="alarmSound" src="alarm.mp3"></audio>

  <div id="alarmBox" style="display:none; font-size:20px; color:red;">
    ALARM!
  <br><br>

  <button onclick="stopAlarm()">Stop</button>
</div>



<script>
    // refactored and made it into one function that displays both time and date
  let alarm = "";

  // had to do a lot of reasearch, hopefully it works.
document.addEventListener("click", function unlockAudio() {
    let sound = document.getElementById("alarmSound");

    sound.play()
        .then(() => {
            sound.pause();
            sound.currentTime = 0;
        })
        .catch(() => {});

    document.removeEventListener("click", unlockAudio);
});
  


  function updateTime() {
    
     let now = new Date();

    let time = now.toLocaleTimeString();
    
    let date = now.toLocaleDateString();

    document.getElementById("time").innerText = time;
    document.getElementById("date").innerText = date;

     let currentTime = now.toTimeString().slice(0, 5);

    if (alarm === currentTime) {
      //alert("Alarm is Ringing!");
      let sound = document.getElementById("alarmSound");
      sound.loop = true;
      sound.play().catch(err => console.warn("play() did not work") );
      if (Notification.permission === "granted") {
        new Notification("Alarm Ringing!");
      }
      document.getElementById("alarmBox").style.display = "block";

      alarm = ""; //change it back to neutral agin
    }
  }

  function stopAlarm() {
    let sound = document.getElementById("alarmSound");

    sound.pause();
    sound.currentTime=0;

    document.getElementById("alarmBox").style.display =  "none"
  }

  function setAlarm() {
    alarm = document.getElementById("alarmTime").value;
    Notification.requestPermission();
    
    alert("Alarm set for " + alarm);

  }

  updateTime();
  setInterval(updateTime, 1000);
</script>

</body>
</html>
